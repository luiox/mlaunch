name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: xmake-io/github-action-setup-xmake@v1.2.5
        with:
          xmake-version: latest

      - name: configure (${{ matrix.mode }})
        run: xmake f -p windows -a x64 -m ${{ matrix.mode }} -y

      - name: build
        run: xmake -y

      - name: test
        run: xmake run core_tests

      - name: locate exe
        id: exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter "mlaunch.exe" | Select-Object -First 1
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: mlaunch-windows-x64-${{ matrix.mode }}
          path: ${{ steps.exe.outputs.path }}
          if-no-files-found: error
