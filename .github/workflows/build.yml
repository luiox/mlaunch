name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  format:
    # 纯文本检查，与平台无关；版本与本机 clang-format 18.1.8 锁死，避免规则漂移。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install clang-format
        run: pip install clang-format==18.1.8
      - name: check formatting
        run: |
          find src tests tools -type f \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug]
    steps:
      - uses: actions/checkout@v4
      # 依赖全部走中心包仓（luiox-repo）git 直连包，仓库自身已无 submodule。

      - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a
        with:
          xmake-version: latest

      - name: configure (${{ matrix.mode }})
        run: xmake f -p windows -a x64 -m ${{ matrix.mode }} -y

      - name: build
        run: xmake -y

      - name: test
        run: |
          xmake run core_tests
          xmake run tools_tests

      - name: locate exe
        id: exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter "mlaunch.exe" | Select-Object -First 1
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: mlaunch-windows-x64-${{ matrix.mode }}
          path: ${{ steps.exe.outputs.path }}
          if-no-files-found: error
